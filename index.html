<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KCE Assistant</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="chat-container">

    <header class="chat-header">
      <div class="header-logo">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10 12 5 2 10l10 5 10-5z" />
          <path d="M6 12v5c3 2 9 2 12 0v-5" />
        </svg>
      </div>
      <div class="header-text">
        <h1>KCE Assistant</h1>
        <p class="status">
          <span class="status-dot"></span>
          Online, replies instantly
        </p>
      </div>
      <svg class="header-menu" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
        <circle cx="12" cy="5" r="2" />
        <circle cx="12" cy="12" r="2" />
        <circle cx="12" cy="19" r="2" />
      </svg>
    </header>

    <div class="chat-messages" id="messages"></div>

    <div class="chat-input">
      <input type="text" id="input" placeholder="Ask about KCE" autocomplete="off" aria-label="Your message">
      <button id="send" type="button" aria-label="Send message">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 2 11 13" />
          <path d="M22 2l-7 20-4-9-9-4z" />
        </svg>
      </button>
    </div>

  </div>

  <script src="scripts.js"></script>

</body>

</html>
